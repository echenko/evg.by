services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80" # ВАЖНО: слушаем только локально для Nginx
    depends_on:
      - backend
    restart: always
    networks:
      - evg-network
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=${PORT:-3000}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo
    restart: always
    networks:
      - evg-network
    deploy:
      resources:
        limits:
          memory: 384M

  mongo:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - evg-network
    deploy:
      resources:
        limits:
          memory: 512M

  mongo-express:
    image: mongo-express:latest
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS:-secret}
    depends_on:
      - mongo
    restart: always
    networks:
      - evg-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mongo-data:

networks:
  evg-network:
    driver: bridge