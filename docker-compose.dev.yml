services:
  mongo:
    image: mongo:7.0
    container_name: evg-mongo
    command: ["--quiet"]
    ports:
      - "27018:27017"
    volumes:
      - evg-mongo-data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: evg-mongo-express
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS:-secret}
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  evg-mongo-data: