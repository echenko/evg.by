<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />

    <title>EVG.BY | Main</title>
    <noscript>
        <link rel="stylesheet" href="./src/styles/common/_noscript.scss" />

<body class="page page--index no-js">
<header class="header">

        <a class="logo__link" href="/">evg.by</a>
    </div>
    
    <button class="header__menu-button" type="button">Menu</button>
    
        <div class="header__auth">

                    <a class="auth__link auth__link--login" href="./login.html">Login</a>

    <main class="main">
        <h2 class="main__title">Welcome to EVG.BY</h2>

    <footer class="footer">
        <div class="footer__container">
            <p class="footer__text">© 2026 EVG.BY. All rights reserved</p>
